name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: models
          key: fastembed-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-v1
      - run: uv run python -m netracare.rag.models download
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=netracare --cov-report=term-missing

  requirements-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install --no-deps -e .
      # Checks that the pinned requirements install and run; model-backed tests run above.
      - run: pytest -m "not live and not models"

  evals-offline:
    # Deterministic evals: no secrets, fails the build on any regression vs evals/baselines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: models
          key: fastembed-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-v1
      - run: uv run python -m netracare.rag.models download
      - run: uv run python -m netracare.evals run all --fail-under
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/evals/
          if-no-files-found: ignore

  evals-opik:
    # Mirrors experiments to Opik Cloud on main when the OPIK_API_KEY secret exists; also runs
    # the live (Groq) suites when GROQ_API_KEY is set. Non-blocking: the offline gate decides.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: evals-offline
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
      OPIK_WORKSPACE: ${{ secrets.OPIK_WORKSPACE }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.OPIK_API_KEY != ''
      - uses: astral-sh/setup-uv@v6
        if: env.OPIK_API_KEY != ''
        with:
          python-version: "3.13"
      - if: env.OPIK_API_KEY != ''
        run: uv sync --frozen
      - if: env.OPIK_API_KEY != ''
        name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: models
          key: fastembed-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-v1
      - if: env.OPIK_API_KEY != ''
        run: |
          for suite in booking_policy safety_redflags_rules eye_fact_safety visit_summary_v0 rag_retrieval router_rules; do
            uv run python -m netracare.evals run "$suite" --upload
          done
      - if: env.OPIK_API_KEY != '' && env.GROQ_API_KEY != ''
        run: |
          uv run python -m netracare.evals run safety_redflags_llm --live --upload
          uv run python -m netracare.evals run visit_summary_live --live --upload
          uv run python -m netracare.evals run router_llm --live --upload
          uv run python -m netracare.evals run rag_answer_live --live --upload
      - if: env.OPIK_API_KEY == ''
        run: echo "OPIK_API_KEY secret not set - skipping Opik upload"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t netracare-api .
