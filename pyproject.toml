[project]
name = "netracare"
version = "0.1.0"
description = "NetraCare - AI front desk & care coordination agent for a fictional eye clinic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi",
    "faker",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "sqlalchemy",
    "structlog",
    "tzdata",
    "uvicorn[standard]",
    "pyjwt>=2.15.1",
    "email-validator>=2.4.0",
    "streamlit>=1.67.0",
    "requests>=2.34.2",
    "opik>=2.2.149",
]

[project.scripts]
netracare-seed = "netracare.seed.__main__:main"

[dependency-groups]
dev = [
    "freezegun",
    "httpx2>=2.16.0",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netracare"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["netracare", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"src/netracare/seed/**" = ["S311"]
"src/netracare/db/migrations/**" = ["E501"]
# Streamlit pages: `if st.button(...): if call(...): st.rerun()` reads better nested.
"src/netracare/ui/app_pages/**" = ["SIM102"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
packages = ["netracare"]

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["src", "."]
markers = [
    "live: calls real external services (LLM, Opik); opt-in",
    "db: uses a real SQLite database with migrations applied",
]

[tool.coverage.run]
source = ["netracare"]
branch = true
