services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/netracare.db
    ports:
      - "8000:8000"
    volumes:
      - netracare-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  seed:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/netracare.db
    volumes:
      - netracare-data:/app/data
    command: ["python", "-m", "netracare.seed", "--root", "/app", "--summary"]
    depends_on:
      api:
        condition: service_healthy
    profiles: ["seed"]

  # Streamlit UI is added in Phase 1.

volumes:
  netracare-data:
